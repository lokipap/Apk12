name: Secure RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    # Run on a Windows PC/VPS you own.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 480

    steps:
      - name: Configure secure RDP
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:RDP_USERNAME -or
              -not $env:RDP_PASSWORD -or
              -not $env:TAILSCALE_AUTH_KEY) {
            throw "Configure RDP_USERNAME, RDP_PASSWORD and TAILSCALE_AUTH_KEY in repository secrets."
          }

          $username = $env:RDP_USERNAME

          if ($username -notmatch '^[a-zA-Z0-9_.-]{1,20}$') {
            throw "Invalid local Windows username."
          }

          # Enable Remote Desktop and Network Level Authentication.
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          # Use the standard RDP security layer.
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' -Value 2

          # Create or update the dedicated local account.
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser -Name $username `
              -Password $securePassword `
              -Description "Authorized RDP account" `
              -PasswordNeverExpires:$false | Out-Null
          } else {
            Set-LocalUser -Name $username `
              -Password $securePassword
          }

          # Add the account to Remote Desktop Users.
          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          $membership = Get-LocalGroupMember `
            -Group $rdpGroup.Name `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "$env:COMPUTERNAME\$username" }

          if (-not $membership) {
            Add-LocalGroupMember `
              -Group $rdpGroup.Name `
              -Member $username
          }

          # Install Tailscale.
          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

          Invoke-WebRequest -Uri $url -OutFile $msi

          $process = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$msi`"", '/quiet', '/norestart') `
            -Wait -PassThru

          Remove-Item $msi -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          # Connect to your Tailscale network.
          & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" `
            --hostname=secure-windows-rdp

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          # Permit RDP only from Tailscale IPv4 addresses.
          Get-NetFirewallRule `
            -DisplayName 'Secure-RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'Secure-RDP-Tailscale' `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Action Allow `
            -Profile Any

          # Restart the Remote Desktop service.
          Restart-Service TermService -Force

          # Display the Tailscale IPv4 address.
          $ip = & $ts ip -4

          if ($LASTEXITCODE -ne 0 -or -not $ip) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          Write-Host "RDP Address: $ip"
          Write-Host "RDP Username: $username"
          Write-Host "RDP Port: 3389"
          Write-Host "RDP Password: Stored securely in GitHub Secrets."
